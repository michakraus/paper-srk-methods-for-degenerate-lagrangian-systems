name: CI

on:
  - push
  - pull_request

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      JULIA_NUM_THREADS: 2
    strategy:
      fail-fast: false
      matrix:
        # The dependencies require Julia 1.10 or newer, so test the long-term support
        # release and the current stable one. `arch` is left to setup-julia, which picks
        # the architecture of the runner (the macOS runners are aarch64).
        version:
          - 'lts'
          - '1'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        experimental: [false]
        include:
          # Early warning for upstream breakage; the package is pure Julia, so a single
          # operating system is enough for that.
          - version: 'nightly'
            os: ubuntu-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage is a nice-to-have here; a missing token must not fail the run.
          fail_ci_if_error: false
